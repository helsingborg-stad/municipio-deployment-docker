services:
  municipio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ACF_PRO_KEY=b3JkZXJfaWQ9ODE2NDZ8dHlwZT1kZXZlbG9wZXJ8ZGF0ZT0yMDE2LTA1LTE2IDExOjEyOjQ4
        - MUNICIPIO_DEPLOYMENT_REF=dockerization
    environment:
      WP_CONF_DB_NAME: municipio
      WP_CONF_DB_USER: municipio
      WP_CONF_DB_PASSWORD: municipio
      WP_CONF_DB_HOST: db
      WP_CONF_WP_SITEURL: http://localhost:9090/wp
      WP_CONF_WP_HOME: http://localhost:9090
      WP_CONF_DB_TABLE_PREFIX: mun_
      WP_CONF_WP_ALLOW_MULTISITE: true
      WP_CONF_SUBDOMAIN_INSTALL: true
      WP_CONF_DOMAIN_CURRENT_SITE: localhost:9090
      WP_CONF_WP_SITE_TITLE: Municipio
      WP_CONF_WP_ADMIN_USER: admin
      WP_CONF_WP_ADMIN_PASSWORD: admin
      WP_CONF_WP_ADMIN_EMAIL: admin@example.com
      WP_CONF_WP_REDIS_DISABLED: false
      # TCP fallback (kept so the redis-cache plugin still works if the socket
      # is unavailable); WP_REDIS_SCHEME/WP_REDIS_PATH below take priority.
      WP_CONF_REDIS_HOST: redis
      WP_CONF_REDIS_SCHEME: unix
      WP_CONF_REDIS_PATH: /var/run/valkey/valkey.sock
      WP_CONF_FORCE_SSL_ADMIN: false
      WP_CONF_EXTRA_MY_CUSTOM_FEATURE: active

    depends_on:
      - db
    ports:
      - "9090:80"
      - "7080:7080"
    volumes:
      - valkey-socket:/var/run/valkey
  
  redis:
    # image: redis:latest
    image: valkey/valkey:9.1.2
    # unixsocketperm 777: both the municipio (uid 1000) and valkey containers
    # need read/write access to the socket file; fine for local dev, tighten
    # (matching uids/gid) before using this pattern anywhere less trusted.
    command: >
      valkey-server
      --port 6379
      --unixsocket /var/run/valkey/valkey.sock
      --unixsocketperm 777
    ports:
      - "6379:6379"
    volumes:
      - valkey-socket:/var/run/valkey

  db:
    image: mariadb:latest
    environment:
      MARIADB_DATABASE: municipio
      MARIADB_USER: municipio
      MARIADB_PASSWORD: municipio
      MARIADB_ROOT_PASSWORD: root
    volumes:  
      - db-data:/var/lib/mysql

volumes:
  db-data:
  valkey-socket:
