name: Build on webhook event

on:
  repository_dispatch:
    types: [ source-tag ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to simulate'
        required: true
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show what triggered this
        env:
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          DELIVERY: ${{ github.event.client_payload.delivery }}
        run: |
          echo "event:     ${{ github.event_name }}"
          echo "type:      ${{ github.event.action }}"
          echo "tag:       $TAG"
          echo "delivery:  ${DELIVERY:-n/a}"
          {
            echo "### Triggered by \`${{ github.event_name }}\`"
            echo "- tag: \`$TAG\`"
            echo "- delivery: \`${DELIVERY:-n/a}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Full payload
        if: github.event_name == 'repository_dispatch'
        run: echo '${{ toJSON(github.event.client_payload) }}'